<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1000" viewBox="0 0 680 500" role="img">
<title>StockPilot structure (app style)</title>
<desc>Three tiers: five interface pages, JavaScript functions that handle actions and rendering, and browser localStorage holding the products and sales arrays.</desc>
<style>
text{font-family:Inter,"Segoe UI",Arial,sans-serif;dominant-baseline:central}
.m{text-anchor:middle}
.brand{font-size:18px;font-weight:700;fill:#f7fbff;letter-spacing:.4px}
.eyebrow{font-size:11px;font-weight:700;fill:#8fc5ed;letter-spacing:1.6px}
.tier-h{font-size:14px;font-weight:700;fill:#12233b}
.tier-s{font-size:12px;fill:#71839a}
.card-t{font-size:14px;font-weight:700;fill:#ffffff}
.card-s{font-size:12px;fill:#9cc3e6}
.lg-t{font-size:14px;font-weight:700;fill:#0b2a4c}
.lg-s{font-size:12px;fill:#174b83}
.key{font-size:12px;fill:#56c5e8}
.lbl{font-size:12px;fill:#a9bdd5}
.foot{font-size:11px;fill:#6f8ba9}
.arr{stroke:#56c5e8;stroke-width:2;fill:none}
</style>
<defs>
<radialGradient id="bg" cx="15%" cy="8%" r="110%"><stop offset="0" stop-color="#174777"/><stop offset=".38" stop-color="#0b2445"/><stop offset="1" stop-color="#06152c"/></radialGradient>
<linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fdfefe"/><stop offset="1" stop-color="#e9f1f9"/></linearGradient>
<linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#164777"/><stop offset="1" stop-color="#0c2c51"/></linearGradient>
<linearGradient id="data" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0e3157"/><stop offset="1" stop-color="#174d7c"/></linearGradient>
<linearGradient id="logo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8ee5ff"/><stop offset="1" stop-color="#2679bd"/></linearGradient>
<linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dcecff"/></linearGradient>
<filter id="sh" x="-5%" y="-10%" width="110%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity=".3"/></filter>
<filter id="sh2" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="2" dy="3" stdDeviation="2.5" flood-color="#000" flood-opacity=".3"/></filter>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#56c5e8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="680" height="500" fill="url(#bg)"/>

<rect x="30" y="20" width="38" height="38" rx="12" fill="url(#logo)" filter="url(#sh2)"/>
<text class="m" x="49" y="40" font-size="22" font-weight="900" fill="#06213d" style="font-family:Inter,'Segoe UI',Arial,sans-serif">S</text>
<text class="brand" x="80" y="31">StockPilot</text>
<text class="eyebrow" x="80" y="48">SYSTEM STRUCTURE</text>

<rect x="30" y="80" width="620" height="105" rx="16" fill="url(#panel)" filter="url(#sh)"/>
<text class="tier-h" x="48" y="100">Interface</text>
<text class="tier-s" x="118" y="100">Sidebar with five pages</text>
<rect x="42" y="118" width="110" height="52" rx="12" fill="url(#card)" stroke="#ffffff" stroke-opacity=".15" filter="url(#sh2)"/>
<text class="card-t m" x="97" y="136">Dashboard</text><text class="card-s m" x="97" y="154">Stats, chart</text>
<rect x="163" y="118" width="110" height="52" rx="12" fill="url(#card)" stroke="#ffffff" stroke-opacity=".15" filter="url(#sh2)"/>
<text class="card-t m" x="218" y="136">Inventory</text><text class="card-s m" x="218" y="154">Product CRUD</text>
<rect x="285" y="118" width="110" height="52" rx="12" fill="url(#card)" stroke="#ffffff" stroke-opacity=".15" filter="url(#sh2)"/>
<text class="card-t m" x="340" y="136">Record sale</text><text class="card-s m" x="340" y="154">Deduct stock</text>
<rect x="407" y="118" width="110" height="52" rx="12" fill="url(#card)" stroke="#ffffff" stroke-opacity=".15" filter="url(#sh2)"/>
<text class="card-t m" x="462" y="136">Transactions</text><text class="card-s m" x="462" y="154">History, CSV</text>
<rect x="528" y="118" width="110" height="52" rx="12" fill="url(#card)" stroke="#ffffff" stroke-opacity=".15" filter="url(#sh2)"/>
<text class="card-t m" x="583" y="136">Reports</text><text class="card-s m" x="583" y="154">Sales summary</text>

<line class="arr" x1="250" y1="188" x2="250" y2="222" marker-end="url(#arrow)"/>
<text class="lbl" x="262" y="205">user actions</text>
<line class="arr" x1="450" y1="222" x2="450" y2="188" marker-end="url(#arrow)"/>
<text class="lbl" x="462" y="205">updated screen</text>

<rect x="30" y="225" width="620" height="105" rx="16" fill="url(#panel)" filter="url(#sh)"/>
<text class="tier-h" x="48" y="245">App logic</text>
<text class="tier-s" x="124" y="245">JavaScript functions</text>
<rect x="42" y="263" width="140" height="52" rx="12" fill="#e8f1fb" stroke="#174b83" stroke-width="1"/>
<text class="lg-t m" x="112" y="281">saveProduct()</text><text class="lg-s m" x="112" y="299">Add, edit, delete</text>
<rect x="196" y="263" width="140" height="52" rx="12" fill="#e8f1fb" stroke="#174b83" stroke-width="1"/>
<text class="lg-t m" x="266" y="281">recordSale()</text><text class="lg-s m" x="266" y="299">Validate, deduct</text>
<rect x="350" y="263" width="140" height="52" rx="12" fill="#e8f1fb" stroke="#174b83" stroke-width="1"/>
<text class="lg-t m" x="420" y="281">renderAll()</text><text class="lg-s m" x="420" y="299">Refresh every page</text>
<rect x="504" y="263" width="134" height="52" rx="12" fill="#e8f1fb" stroke="#174b83" stroke-width="1"/>
<text class="lg-t m" x="571" y="281">exportCSV()</text><text class="lg-s m" x="571" y="299">Download history</text>

<line class="arr" x1="250" y1="333" x2="250" y2="367" marker-end="url(#arrow)"/>
<text class="lbl" x="262" y="350">persist()</text>
<line class="arr" x1="450" y1="367" x2="450" y2="333" marker-end="url(#arrow)"/>
<text class="lbl" x="462" y="350">load on start</text>

<rect x="30" y="370" width="620" height="105" rx="16" fill="url(#panel)" filter="url(#sh)"/>
<text class="tier-h" x="48" y="390">Data</text>
<text class="tier-s" x="90" y="390">Browser localStorage</text>
<rect x="42" y="408" width="290" height="52" rx="12" fill="url(#data)" stroke="#ffffff" stroke-opacity=".15" filter="url(#sh2)"/>
<text class="card-t m" x="187" y="426">products array</text><text class="key m" x="187" y="444">stockpilot_inventory_v1</text>
<rect x="348" y="408" width="290" height="52" rx="12" fill="url(#data)" stroke="#ffffff" stroke-opacity=".15" filter="url(#sh2)"/>
<text class="card-t m" x="493" y="426">sales array</text><text class="key m" x="493" y="444">stockpilot_sales_v1</text>

<text class="foot m" x="340" y="490">StockPilot · Small Business Inventory and Sales Tracker · Data stored locally in your browser</text>
</svg>
